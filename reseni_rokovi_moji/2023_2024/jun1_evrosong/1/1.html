<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evrosong</title>
    <link rel="stylesheet" href="1.css">
</head>

<body>

    <img src="1.jpg" alt="Evrosong logo" class="slika">

    <h1 class="naslov">Contest results</h1>

    <table class="tabela">

        <tr class="crni-red">
            <th>#</th>
            <th>Artist</th>
            <th>Country</th>
            <th>Points</th>
        </tr>

        <tr class="sivi-red">
            <td>1</td>
            <td>Baby Lasagna</td>
            <td>Croatia</td>
            <td>450</td>
        </tr>

        <tr class="crni-red">
            <td>2</td>
            <td>Nemo</td>
            <td>Switzerland</td>
            <td>400</td>
        </tr>

        <tr class="sivi-red">
            <td class="broj">3</td>
            <td>Teya Dora</td>
            <td>Serbia</td>
            <td>100</td>
        </tr>

    </table>

    <div class="div-forma">

        <form>

            <div class="div-forma-2">
                <label>Enter points:</label>
                <input type="number">

                <label>Select country for:</label>
                <select>
                    <option>Serbia</option>
                    <option>Croatia</option>
                    <option>Switzerland</option>
                </select>

                <label>Select country from:</label>
                <select>
                    <option>Switzerland</option>
                    <option>Serbia</option>
                    <option>Croatia</option>
                </select> <br>
            </div>

            <div class="dugme">
                <button>Send</button>
            </div>

        </form>

    </div>

</body>
</html>
