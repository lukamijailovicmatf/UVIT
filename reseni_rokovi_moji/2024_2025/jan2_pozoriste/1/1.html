<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>Repertoar za septembar</title>
    <link rel="stylesheet" href="stil.css">
</head>
<body>

    <!-- kutija koja sadrzi podatke o sve tri predstave -->
    <div class="glavni-kontejner">
        <h1>Repertoar za septembar</h1>
        <hr>

        <!-- kutija koja sadrzi podatke o predstavi "Vrat od stakla" -->
        <div class="predstava">
            <div class="datum-blok">
                <div class="dan">Petak</div>
                <div class="datum-broj-mesec">
                    <div class="broj">13</div>
                    <div class="mesec">Septembar</div>
                </div>
            </div>

            <div class="poster">
                <img src="vratodstakla.jpg" alt="Vrat od stakla">
            </div>

            <div class="detalji">
                <div class="pisac">Biljana Srbljanović</div>
                <div class="naslov">Vrat od stakla</div>
                <div class="scena">Velika scena "Ljuba Tadić"</div>
                <div class="vreme">20:00h</div>
            </div>
        </div>

        <!-- kutija koja sadrzi podatke o predstavi "Pucina" -->
        <div class="predstava">
            <div class="datum-blok">
                <div class="dan">Subota</div>
                <div class="datum-broj-mesec">
                    <div class="broj">14</div>
                    <div class="mesec">Septembar</div>
                </div>
            </div>

            <div class="poster">
                <img src="pucina.jpg" alt="Pučina">
            </div>

            <div class="detalji">
                <div class="pisac">Branislav Nušić</div>
                <div class="naslov">Pučina</div>
                <div class="scena">Velika scena "Ljuba Tadić"</div>
                <div class="vreme">20:00h</div>
            </div>
        </div>

        <!-- kutija koja sadrzi podatke o predstavi "Ujka Vanja" -->
        <div class="predstava">
            <div class="datum-blok">
                <div class="dan">Nedelja</div>
                <div class="datum-broj-mesec">
                    <div class="broj">15</div>
                    <div class="mesec">Septembar</div>
                </div>
            </div>

            <div class="poster">
                <img src="ujkavanja.jpg" alt="Ujka Vanja">
            </div>

            <div class="detalji">
                <div class="pisac">Anton Pavlovič Čehov</div>
                <div class="naslov">Ujka Vanja</div>
                <div class="scena">Velika scena "Ljuba Tadić"</div>
                <div class="vreme">19:00h</div>
            </div>
        </div>
    </div>

</body>
</html>
